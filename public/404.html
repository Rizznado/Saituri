<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>გვერდი ვერ მოიძებნა — Saituri</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Figtree:wght@400;600&family=Noto+Sans+Georgian:wght@400;600&display=swap">
<style>
  :root{--bg:#060B16;--fg:#F4F7FF;--muted:#C6D0E6;--accent:#3D8BFF;--spark:#7CE7FF;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;background:var(--bg);color:var(--fg);font-family:"Figtree","Noto Sans Georgian",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
  img{width:96px;height:96px}
  h1{font-family:"Unbounded","Noto Sans Georgian",sans-serif;font-size:clamp(40px,10vw,72px);margin:18px 0 6px;color:var(--spark)}
  p{color:var(--muted);margin:0 0 26px;font-size:17px}
  a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:15px 24px;border-radius:999px}
</style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="Saituri">
    <h1>404</h1>
    <p>ეს გვერდი ვერ მოიძებნა.</p>
    <a href="/">მთავარ გვერდზე დაბრუნება</a>
  </main>
</body>
</html>
